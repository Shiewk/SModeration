plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "${runPaperVersion}"
}

group = 'de.shiewk'
version = pluginVersion

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup "de.maxhenkel.voicechat"
        }
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

runPaper {
    folia {
        registerTask()
    }
}

runServer {
    minecraftVersion("1.21.6")
}

dependencies {
    //compileOnly "io.papermc.paper:paper-api:${apiVersion}"
    compileOnly "dev.folia:folia-api:${apiVersion}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voiceChatApiVersion}"
}

jar {
    archiveBaseName.set('SModeration-Paper')
    archiveVersion.set(pluginVersion)
}


def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}